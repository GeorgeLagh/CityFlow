name: Amsterdam Bulk Registry Discovery 20260722
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  discover:
    if: github.head_ref == 'assistant/amsterdam-core-countvalidated-20260722'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id:
          - bbga_v1_kerncijfers_openbaar.csv.zip
          - loopfietsnetwerk_v1_edges_openbaar.csv.zip
          - loopfietsnetwerk_v1_nodes_poi_openbaar.csv.zip
          - loopfietsnetwerk_v1_poi_adressen_openbaar.csv.zip
          - loopfietsnetwerk_v1_compleet_openbaar.csv.zip
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - name: Resolve bulk registry record
        env:
          BULK_ID: ${{ matrix.id }}
        run: |
          python - <<'PY'
          import json,os,requests,urllib.parse
          from pathlib import Path
          bid=os.environ['BULK_ID'];out=Path('out');out.mkdir(exist_ok=True)
          base='https://api.data.amsterdam.nl/v1/bulk_data/csv'
          s=requests.Session();s.headers.update({'User-Agent':'AmsterdamUrbanTransitionDataLake/8.0 research','Accept':'application/hal+json'})
          attempts=[]
          urls=[base+'/'+urllib.parse.quote(bid,safe=''),base]
          params=[None,{'id':bid},{'id[like]':'*'+bid.split('_v1_')[0]+'*'}]
          for url in urls:
              for par in params:
                  try:
                      r=s.get(url,params=par,timeout=120)
                      entry={'url':r.url,'status':r.status_code,'headers':dict(r.headers),'text':r.text[:200000]}
                      try:entry['json']=r.json()
                      except:pass
                      attempts.append(entry)
                  except Exception as e:attempts.append({'url':url,'params':par,'error':repr(e)})
          (out/'discovery.json').write_text(json.dumps({'bulk_id':bid,'attempts':attempts},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'bulk_id':bid,'statuses':[x.get('status') for x in attempts],'urls':[x.get('url') for x in attempts]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: amsterdam-bulk-registry-${{ strategy.job-index }}-20260722
          path: out/
          retention-days: 7
