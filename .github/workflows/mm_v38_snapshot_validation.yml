name: MM v3.8 full-year snapshot validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'tmp_v38_full_year/**'
      - '.github/workflows/mm_v38_snapshot_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate empirical snapshot and semantic gates
        run: python tmp_v38_full_year/validate_snapshot.py
