name: Amsterdam O&S Mobility Workbooks Acquisition

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download all official O&S mobility XLSX workbooks
        run: |
          python -m pip install --quiet beautifulsoup4 requests
          mkdir -p out/workbooks
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          page_url='https://onderzoek.amsterdam.nl/dataset/mobiliteit-en-openbaar-vervoer-in-amsterdam'
          cms_base='https://cms.onderzoek-en-statistiek.nl'
          out=Path('out'); wbdir=out/'workbooks'
          s=requests.Session(); s.headers.update({'User-Agent':'Amsterdam-configurational-crystallization-research/1.0'})
          r=s.get(page_url,timeout=120); r.raise_for_status()
          (out/'source_page.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'html.parser')
          title_by_filename={}
          paths=[]
          for tr in soup.find_all('tr'):
              title=' '.join(tr.find('td').get_text(' ',strip=True).split()) if tr.find('td') else ''
              btn=tr.find(attrs={'data-log-event-file-name':True})
              if btn:
                  fn=btn.get('data-log-event-file-name','').strip()
                  if fn.lower().endswith('.xlsx'):
                      title_by_filename[fn]=title
                      paths.append({'path':'/uploads/'+fn,'title':title,'discovery':'button_data_attribute'})
          for m in re.finditer(r'(?P<path>/uploads/[^"\\<>\s]+?\.xlsx)',r.text,re.I):
              path=m.group('path').replace('\\/','/')
              fn=Path(path).name
              paths.append({'path':path,'title':title_by_filename.get(fn,''),'discovery':'embedded_json_url'})
          for m in re.finditer(r'data-log-event-file-name="([^"]+\.xlsx)"',r.text,re.I):
              fn=m.group(1)
              paths.append({'path':'/uploads/'+fn,'title':title_by_filename.get(fn,''),'discovery':'button_regex'})
          dedup=[];seen=set()
          for c in paths:
              path=c['path']
              if path in seen: continue
              seen.add(path)
              dedup.append({**c,'frontend_url':urljoin(page_url,path),'binary_url':urljoin(cms_base,path)})
          manifest={'source_page':page_url,'binary_host':cms_base,'page_status':r.status_code,'page_sha256':hashlib.sha256(r.content).hexdigest(),'discovered_candidates':dedup,'files':[]}
          for i,c in enumerate(dedup,1):
              u=c['binary_url']
              try:
                  rr=s.get(u,timeout=180,allow_redirects=True); rr.raise_for_status()
                  content=rr.content; ctype=rr.headers.get('content-type','')
                  is_xlsx=content.startswith(b'PK\x03\x04') and len(content)>5000
                  rec={'frontend_url':c['frontend_url'],'binary_url':u,'resolved_url':rr.url,'title':c['title'],'discovery':c['discovery'],'status_code':rr.status_code,'content_type':ctype,'bytes':len(content),'sha256':hashlib.sha256(content).hexdigest(),'is_xlsx_container':is_xlsx,'last_modified':rr.headers.get('last-modified'),'etag':rr.headers.get('etag')}
                  if is_xlsx:
                      name=Path(urlparse(rr.url).path).name or f'mobility_{i:02d}.xlsx'
                      if not name.lower().endswith('.xlsx'): name=f'mobility_{i:02d}.xlsx'
                      name=re.sub(r'[^A-Za-z0-9._-]+','_',name)
                      if (wbdir/name).exists(): name=f'{i:02d}_{name}'
                      (wbdir/name).write_bytes(content); rec['saved_as']=name
                  manifest['files'].append(rec)
              except Exception as e:
                  manifest['files'].append({'frontend_url':c['frontend_url'],'binary_url':u,'title':c['title'],'discovery':c['discovery'],'error':repr(e)})
          xlsx=[x for x in manifest['files'] if x.get('is_xlsx_container')]
          manifest['xlsx_count']=len(xlsx)
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'candidates':len(dedup),'xlsx_count':len(xlsx),'files':[x.get('saved_as') for x in xlsx]},ensure_ascii=False,indent=2))
          if len(xlsx)!=10: raise SystemExit(f'Expected exactly 10 XLSX files, got {len(xlsx)}')
          PY
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsterdam-os-mobility-workbooks-20260721
          path: out
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
