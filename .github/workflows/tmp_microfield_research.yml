name: Temporary microfield empirical research

on:
  push:
    branches:
      - tmp/microfield-research-20260710
    paths:
      - 'tmp_microfield_runner/**'
      - '.github/workflows/tmp_microfield_research.yml'

concurrency:
  group: tmp-microfield-research-20260710
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/microfield-research-20260710
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical stack
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run boundary-safe matched-state BBO calibration
        shell: bash
        run: |
          mkdir -p tmp_microfield_results_qf_null_v2
          set +e
          python tmp_microfield_runner/run_qf_matched_null_v2.py > tmp_microfield_results_qf_null_v2/RUN.log 2>&1
          code=$?
          echo "$code" > tmp_microfield_results_qf_null_v2/EXIT_CODE.txt
          set -e
      - name: Commit compact results
        if: always()
        run: |
          git config user.name 'microfield-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp_microfield_results_qf_null_v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record boundary-safe QF null results [skip ci]'
          git push origin HEAD:tmp/microfield-research-20260710
