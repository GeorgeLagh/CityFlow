name: Market Metastability v3.6 commodity MBO pilot

on:
  pull_request:
    branches: [master]
    paths:
      - 'tmp_commodity_mbo/**'
      - '.github/workflows/mm_v36_commodity_mbo_pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      MM_V36_OUT: tmp_commodity_mbo_results
      MM_V36_START: '2026-07-14T14:30:00Z'
      MM_V36_END: '2026-07-14T14:31:00Z'
      MM_V36_MAX_COST_USD: '5.00'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Databento and numerical stack
        run: python -m pip install --upgrade pip databento numpy pandas pyarrow zstandard
      - name: Validate runner syntax
        run: python -m py_compile tmp_commodity_mbo/run_v36_commodity_mbo_pilot.py
      - name: Run capped native-MBO pilot
        run: python tmp_commodity_mbo/run_v36_commodity_mbo_pilot.py
      - name: Upload pilot result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm-v36-commodity-mbo-pilot
          path: tmp_commodity_mbo_results
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
