name: MM v3.7 unified commodity data fabric

on:
  pull_request:
    branches: [master]
    paths:
      - 'tmp_unified_commodity_fabric/**'
      - '.github/workflows/mm_v37_unified_commodity_fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-and-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy pandas pytest
      - run: bash tmp_unified_commodity_fabric/run_fixture.sh v37_fixture
      - uses: actions/upload-artifact@v4
        with:
          name: mm-v37-unified-fabric-fixture
          path: v37_fixture/output
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
