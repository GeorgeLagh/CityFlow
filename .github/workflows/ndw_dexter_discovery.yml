name: NDW Dexter Open Data Discovery

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Dexter pages and inspect frontend assets
        run: |
          python -m pip install --quiet beautifulsoup4 requests
          mkdir -p out/pages out/assets
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json,re
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup

          out=Path('out')
          urls=[
            'https://dexter.ndw.nu/opendata/',
            'https://dexter.ndw.nu/opendata/bicycle/',
            'https://dexter.ndw.nu/opendata/expert-avg',
            'https://dexter.ndw.nu/robots.txt',
            'https://dexter.ndw.nu/manifest.json',
            'https://dexter.ndw.nu/asset-manifest.json',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Amsterdam-configurational-crystallization-research/1.0'})
          manifest={'pages':[],'assets':[],'candidate_endpoints':[]}
          assets=[]
          for i,u in enumerate(urls,1):
            try:
              r=s.get(u,timeout=120,allow_redirects=True)
              fn=f'{i:02d}_{re.sub(r"[^A-Za-z0-9._-]+","_",urlparse(u).path.strip("/") or "root")}.bin'
              (out/'pages'/fn).write_bytes(r.content)
              rec={'requested_url':u,'resolved_url':r.url,'status_code':r.status_code,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'headers':dict(r.headers),'saved_as':fn}
              manifest['pages'].append(rec)
              if 'html' in (r.headers.get('content-type') or '').lower():
                soup=BeautifulSoup(r.text,'html.parser')
                for tag,attr in [('script','src'),('link','href')]:
                  for el in soup.find_all(tag):
                    v=el.get(attr)
                    if not v:continue
                    full=urljoin(r.url,v)
                    if full.startswith('https://dexter.ndw.nu/') and full not in assets:
                      assets.append(full)
            except Exception as e:
              manifest['pages'].append({'requested_url':u,'error':repr(e)})
          endpoint_patterns=[
            r'https?://[^"\'<>\\\s]+',
            r'/(?:api|graphql|swagger|openapi|download|export|data|measurements?|locations?|traffic|bicycle)[A-Za-z0-9_./?=&{}:-]*',
          ]
          candidates=set()
          for i,u in enumerate(assets,1):
            try:
              r=s.get(u,timeout=120);r.raise_for_status()
              ext=Path(urlparse(u).path).suffix or '.bin'
              fn=f'{i:03d}_{hashlib.sha1(u.encode()).hexdigest()[:10]}{ext}'
              (out/'assets'/fn).write_bytes(r.content)
              text=r.text if any(x in (r.headers.get('content-type') or '').lower() for x in ['javascript','json','text','css']) else ''
              for pat in endpoint_patterns:
                for m in re.finditer(pat,text,re.I):
                  val=m.group(0).replace('\\/','/')
                  if any(k in val.lower() for k in ['api','download','export','measurement','location','traffic','bicycle','graphql','swagger','openapi']):
                    candidates.add(val[:1000])
              manifest['assets'].append({'url':u,'status_code':r.status_code,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'saved_as':fn})
            except Exception as e:
              manifest['assets'].append({'url':u,'error':repr(e)})
          manifest['candidate_endpoints']=sorted(candidates)
          manifest['cookies']=s.cookies.get_dict()
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'pages':len(manifest['pages']),'assets':len(manifest['assets']),'candidate_endpoints':len(candidates)},indent=2))
          PY
      - name: Upload discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndw-dexter-open-data-discovery-20260721
          path: out
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
